<!doctype html>
<!-- Varsayılan SEO metinleri: src/constants/seoDefaults.js ile uyumlu tutun (ilk HTML yanıtı / JS öncesi). -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=no, viewport-fit=cover"
    />

    <!-- Performans: Kritik origin'lere ön bağlantı (Core Web Vitals / LCP) -->
    <link rel="preconnect" href="https://www.seller.tedarika.com.tr" crossorigin />
    <link rel="dns-prefetch" href="https://www.seller.tedarika.com.tr" />
    <link rel="preconnect" href="https://www.tedarika.com.tr" crossorigin />
    <link rel="dns-prefetch" href="https://www.tedarika.com.tr" />

    <!-- Favicon (PNG fallback - logo.svg yoksa /images/logo.png kullan) -->
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="theme-color" content="#003636" />

    <!-- PWA / Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- SEO Meta (Google snippet ve sıralama için: başlık ~60 karakter, açıklama ~155 karakter) -->
    <meta
      name="description"
      content="Tedarika Satıcı Paneli: B2B pazaryerinde mağazanızı ücretsiz açın. Türkiye'den dünyaya ihracat, güvenli ödeme, kolay ürün yönetimi. KOBİ ve üreticiler için dijital e-ihracat platformu."
    />
    <meta
      name="keywords"
      content="tedarika satıcı paneli, B2B pazaryeri, ihracat platformu, satıcı paneli, mağaza açma, ürün yönetimi, toptan satış, KOBİ ihracat, B2B e-ticaret, e-ihracat, dijital ticaret, Türkiye ihracat, global ticaret, satıcı kayıt, Tedarika mağaza, toptan satış platformu, üretici satış, ihracat yazılımı, B2B satış paneli"
    />
    <meta name="author" content="Tedarika" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Turkish" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.seller.tedarika.com.tr/seller/landing" />
    <meta property="og:title" content="Tedarika Satıcı Paneli - B2B Pazaryerinde Mağazanızı Açın" />
    <meta property="og:description" content="Türkiye'den dünyaya ihracat yapın. Güvenli ödeme, kolay ürün yönetimi, global alıcılara ulaşın. KOBİ'ler için en hızlı büyüyen B2B platformu." />
    <meta property="og:image" content="https://www.seller.tedarika.com.tr/images/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tedarika Satıcı Paneli - B2B Pazaryeri" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Tedarika" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.seller.tedarika.com.tr/seller/landing" />
    <meta name="twitter:title" content="Tedarika Satıcı Paneli - B2B Pazaryerinde Mağazanızı Açın" />
    <meta name="twitter:description" content="Türkiye'den dünyaya ihracat yapın. Güvenli ödeme, kolay ürün yönetimi, global alıcılara ulaşın." />
    <meta name="twitter:image" content="https://www.seller.tedarika.com.tr/images/logo.png" />
    <meta name="twitter:image:alt" content="Tedarika Satıcı Paneli - B2B Pazaryeri" />
    
    <!-- Canonical: Kök (/) client-side ile /seller/landing'e yönlendiği için standart URL landing (Google duplicate content önlemi) -->
    <link rel="canonical" href="https://www.seller.tedarika.com.tr/seller/landing" />
    
    <!-- Hreflang Tags -->
    <link rel="alternate" hreflang="tr" href="https://www.seller.tedarika.com.tr/seller/landing" />
    <link rel="alternate" hreflang="x-default" href="https://www.seller.tedarika.com.tr/seller/landing" />
    
    <!-- Additional SEO -->
    <meta name="geo.region" content="TR" />
    <meta name="geo.placename" content="Turkey" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Search Console: Doğrulama için meta tag ekleyin (Örnek: <meta name="google-site-verification" content="XXXXXXXX" />) -->

    <!-- Yapısal veri (JSON-LD) - Google zengin sonuçlar ve snippet için -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.seller.tedarika.com.tr/#organization",
          "name": "Tedarika",
          "url": "https://www.tedarika.com.tr",
          "logo": "https://www.seller.tedarika.com.tr/images/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+90-538-236-26-05",
            "contactType": "customer service",
            "availableLanguage": ["Turkish", "English"],
            "areaServed": "TR",
            "email": "info@tedarika.com.tr"
          },
          "sameAs": [
            "https://www.linkedin.com/company/tedarika",
            "https://twitter.com/tedarika"
          ]
        },
        {
          "@type": "WebSite",
          "name": "Tedarika Satıcı Paneli",
          "url": "https://www.seller.tedarika.com.tr",
          "description": "Türkiye'nin B2B pazaryeri satıcı paneli. Mağazanızı açın, ihracat yapın, global alıcılara ulaşın.",
          "publisher": { "@id": "https://www.seller.tedarika.com.tr/#organization" },
          "inLanguage": "tr",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://www.seller.tedarika.com.tr/seller/landing?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "Tedarika Satıcı Paneli",
          "url": "https://www.seller.tedarika.com.tr/seller/landing",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Any",
          "description": "B2B pazaryerinde mağaza açma, ürün yönetimi, sipariş takibi ve e-ihracat için satıcı paneli. KOBİ ve üreticiler için ücretsiz kayıt.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" },
          "publisher": { "@id": "https://www.seller.tedarika.com.tr/#organization" }
        }
      ]
    }
    </script>

    <title>Tedarika Satıcı Paneli - B2B Pazaryeri ile İhracat Yapın | Mağazanızı Ücretsiz Açın</title>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
